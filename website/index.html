<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor — the notch, put to work</title>
    <meta name="description" content="Visor is a free, open-source Mac app that turns your MacBook's notch into a music player, calendar, file shelf and HUD. Try it in your browser and download for macOS or Windows." />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Visor — the notch, put to work" />
    <meta property="og:description" content="Try the notch in a browser desktop and download Visor for macOS or Windows. Free and open source." />
    <meta property="og:image" content="https://raw.githubusercontent.com/apurvamukherjee/visor-mac-island/main/assets/readme/home.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="%BASE_URL%icon.png" />
    <!-- Inline so the boot screen paints before the bundle arrives; it covers the download like a Mac starting up. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; background: #000; transition: opacity 0.5s ease; }
      .boot-bar { width: 180px; height: 5px; border-radius: 3px; background: rgb(255 255 255 / 0.22); overflow: hidden; }
      .boot-bar i { display: block; width: 0; height: 100%; border-radius: inherit; background: #fff; transition: width 8s cubic-bezier(0.1, 0.6, 0.3, 1); }
      /* ponytail: timed, not real progress (a module script's download isn't observable); stalls at 85% until the app mounts. */
      #boot.is-loading .boot-bar i { width: 85%; }
      #boot.is-done .boot-bar i { width: 100%; transition-duration: 0.3s; }
      #boot.is-done { opacity: 0; transition-delay: 0.35s; }
    </style>
    <!-- Without JavaScript the boot screen is never removed; show the fallback on black instead. -->
    <noscript><style>#boot { display: none; } body { background: #000; }</style></noscript>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img src="%BASE_URL%icon.png" alt="" width="96" height="96" />
      <div class="boot-bar"><i></i></div>
    </div>
    <script>
      {
        const boot = document.getElementById('boot');
        let welcomed = true;
        try {
          welcomed = localStorage.getItem('visor.welcomed') !== null;
        } catch {
          // Storage blocked: src/store/lock.ts treats this visitor as returning too.
        }
        // Returning visitors have the assets cached, so they skip the boot and the welcome.
        if (welcomed) boot.remove();
        else requestAnimationFrame(() => requestAnimationFrame(() => boot.classList.add('is-loading')));
      }
    </script>
    <div id="root"></div>
    <noscript>
      <div style="position: fixed; top: 18vh; left: 0; right: 0; max-width: 520px; margin: 0 auto; padding: 0 24px; font: 15px/1.5 -apple-system, system-ui, sans-serif; color: #f4f4f5; text-align: center;">
        <h1 style="margin: 0 0 8px;">Visor</h1>
        <p>This website is a working macOS desktop and needs JavaScript. Visor itself is a free, open-source notch app for MacBooks and Windows PCs.</p>
        <p><a style="color: #60a5fa;" href="https://github.com/apurvamukherjee/visor-mac-island/releases/latest/download/Visor.dmg">Download for macOS</a> · <a style="color: #60a5fa;" href="https://github.com/apurvamukherjee/visor-mac-island">GitHub</a></p>
        <a href="https://macnative.io/apps/visor?utm_source=macnative-badge&amp;utm_medium=referral"><img src="https://macnative.io/badge?kind=listed&amp;theme=dark&amp;slug=visor" alt="Listed on MacNative" width="160" height="44"></a>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
