name: Windows

on:
  push:
    branches: [main]
    paths: [windows/**, .github/workflows/windows.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            windows/package-lock.json
            website/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: npm ci
      # Shared components import from website/, whose types resolve from its own node_modules.
      - run: npm ci
        working-directory: website
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx tauri build
      # Until Phase 6 attaches it to releases, the installer is only a run artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: Visor-windows-setup
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
