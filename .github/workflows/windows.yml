name: Windows

on:
  push:
    branches: [main]
    # website/src too: the island imports shared components from it.
    paths: [windows/**, website/src/**, .github/workflows/windows.yml]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to attach the installer to, e.g. windows-v3.7.2
        required: false

permissions:
  # Only to attach the installer to a published release.
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            windows/package-lock.json
            website/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: npm ci
      # Shared components import from website/, whose types resolve from its own node_modules.
      - run: npm ci
        working-directory: website
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # A release builds as its tag's version, so the app's update check compares like with like.
      - if: env.TAG != ''
        # windows-v3.7.2 and v3.7.2 both build as 3.7.2.
        run: |
          v=${TAG#windows-}
          echo "VERSION=${v#v}" >> "$GITHUB_ENV"
      - run: npx tauri build ${VERSION:+--config "{\"version\":\"$VERSION\"}"}
      # After the build, which leaves the dist/ that generate_context! needs.
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: Visor-windows-setup
          path: windows/src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach the installer to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe "Visor-Setup-$VERSION.exe"
          gh release upload "$TAG" "Visor-Setup-$VERSION.exe" --clobber

      - name: Fill in the winget manifest
        if: env.TAG != ''
        run: |
          sha=$(sha256sum "Visor-Setup-$VERSION.exe" | cut -d' ' -f1)
          mkdir -p manifest
          for f in winget/*.yaml; do
            sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$sha/g" "$f" > "manifest/$(basename "$f")"
          done
      - if: env.TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifest
          path: windows/manifest/
